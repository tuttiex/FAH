<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haus — list and find a home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #12AD5C;
    --green-tint: #E7F7EE;
    --green-tint-strong: #CDEEDB;
    --ink: #10241B;
    --ink-soft: #4B5D54;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 32px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: var(--ink);
  }

  .logo svg { display: block; }

  .logo span {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: -0.01em;
  }

  .login-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid var(--green-tint-strong);
    background: var(--white);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    padding: 0;
  }

  .login-btn:hover {
    background: var(--green-tint);
    border-color: var(--green);
  }

  .login-btn:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  main {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    overflow: hidden;
  }

  .roofline {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(820px, 130vw);
    transform: translate(-50%, -54%);
    z-index: 0;
    pointer-events: none;
  }

  .hero {
    position: relative;
    z-index: 1;
    max-width: 620px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  h1 {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(28px, 4.6vw, 42px);
    line-height: 1.28;
    letter-spacing: -0.015em;
    color: var(--ink);
  }

  h1 em {
    font-style: normal;
    color: var(--green);
  }

  .actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 14px 30px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--green);
    color: var(--white);
  }

  .btn-primary:hover { background: #0f9a51; }

  .btn-secondary {
    background: var(--white);
    color: var(--green);
    border-color: var(--green);
  }

  .btn-secondary:hover { background: var(--green-tint); }

  .btn:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 3px;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  @media (max-width: 480px) {
    header { padding: 20px; }
    .actions { width: 100%; }
    .btn { flex: 1; justify-content: center; padding: 14px 20px; }
    .hero { gap: 32px; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#" aria-label="Haus home">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 15L15 5L26 15" stroke="#12AD5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 12.5V25H23V12.5" stroke="#12AD5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13 25V18H17V25" stroke="#12AD5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Haus</span>
  </a>

  <button class="login-btn" aria-label="Log in">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="6" r="3" stroke="#12AD5C" stroke-width="1.6"/>
      <path d="M3.5 15C4.3 12 6.4 10.5 9 10.5C11.6 10.5 13.7 12 14.5 15" stroke="#12AD5C" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main>
  <svg class="roofline" viewBox="0 0 820 260" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M40 220L410 30L780 220" stroke="#CDEEDB" stroke-width="2" stroke-linecap="round"/>
    <path d="M120 220V150" stroke="#CDEEDB" stroke-width="2" stroke-linecap="round"/>
    <path d="M700 220V150" stroke="#CDEEDB" stroke-width="2" stroke-linecap="round"/>
  </svg>

  <div class="hero">
    <h1>Welcome to Haus — <br>the best place to <em>list</em> and <em>find</em> a home.</h1>

    <div class="actions">
      <a href="#list" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 3V15M3 9H15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        </svg>
        List
      </a>
      <a href="#rent" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6.5" cy="6.5" r="3.2" stroke="#12AD5C" stroke-width="1.6"/>
          <path d="M8.8 8.8L15 15M15 15V11M15 15H11" stroke="#12AD5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Rent
      </a>
    </div>
  </div>
</main>

<footer>&copy; 2026 Haus. Home for everyone.</footer>

</body>
</html>
